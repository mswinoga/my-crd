# Deliberately kept OUT of ci/test-values/ — this fixture is expected to
# make `helm template` exit non-zero, not render. `make dev`'s loop
# blindly iterates ci/test-values/*.yaml and would abort on the first
# failing command, so this lives in its own directory and is exercised
# only by tests/diagnostics_test.sh's explicit exit-code check.
#
# A malformed regex in a service variable's match: is the one case in this whole
# library that DOES abort the render (crdkit.matchRules uses
# mustRegexMatch/mustRegexReplaceAll deliberately) rather than emitting
# a diagnostic comment — see crdkit's CLAUDE.md for why.
target: prod-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_BAD_REGEX:
          match:
            - "qa[pm1-0[0-9]": "unreachable"
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@APP_BAD_REGEX@"}
