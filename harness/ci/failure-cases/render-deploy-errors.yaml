# Deliberately kept OUT of ci/test-values/ — in deploy mode an ERROR
# aborts the render with control data (see mycrd.render), so this is
# expected to make `helm template` exit non-zero. Exercised by
# tests/render_mode_test.yaml and tests/diagnostics_test.sh.
#
# Two services declare SHARED, deliberately unprefixed (ERROR); the unresolved marker adds a
# WARNING, so the control data carries both kinds.
renderMode: deploy

target: prod-01

application:
  services:
    ALPHA:
      type: environment
      environment:
        SHARED: "one"
    BETA:
      type: environment
      environment:
        SHARED: "two"
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@NOT_A_TOKEN@"}
