# `environment` given as a list instead of a map: ignored with a
# WARNING. The greeter service's type handler still generates its
# variable.
target: prod-01

services:
  orders:
    type: environment
    environment:
      - DB_HOST
  hello:
    type: greeter
    greeting: "hi"
    environment:
      - not-a-map

spec:
  greeter: "@HELLO_GREETER@"
