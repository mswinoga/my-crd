# `environment` given as a list instead of a map: ignored with a
# WARNING. The greeter service's type handler still generates its
# variable.
target: prod-01

application:
  services:
    ORDERS:
      type: environment
      environment:
        - ORDERS_DB_HOST
    HELLO:
      type: greeter
      greeting: "hi"
      environment:
        - not-a-map
