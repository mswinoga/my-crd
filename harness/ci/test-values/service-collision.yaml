# The same variable name declared by two services (deliberately
# unprefixed). Expect an "# ERROR:" naming both services; the
# alphabetically first service ('ALPHA') keeps the name, so @SHARED@
# resolves to its value.
target: prod-01

application:
  services:
    BETA:
      type: environment
      environment:
        SHARED: "from-beta"
    ALPHA:
      type: environment
      environment:
        SHARED: "from-alpha"
    PROBE:
      type: environment
      environment:
        PROBE_SHARED: {targetContainer: main, default: "@SHARED@"}
