# 'enabled' must be a boolean: the string "false" is not one. Expect one
# "# ERROR:" ("'application.services.STRICT.enabled' must be of type
# 'bool' — ignored"); the schema default (true) applies, so the service
# is present in the output.
target: prod-01

application:
  services:
    STRICT:
      type: greeter
      enabled: "false"
      greeting: hello
