# A variable setting 'service' itself. Expect a "# WARNING:" and the
# parent service ID ('APP') to win.
target: prod-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_OWNED:
          default: "v"
          service: someone-else
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@APP_OWNED@"}
