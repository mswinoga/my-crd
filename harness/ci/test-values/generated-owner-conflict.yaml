# The 'greeter' demo service generates GREETER_GREETING, but service
# 'alpha' already declares a variable of that name. Expect an "# ERROR:"
# ("already owned by service 'alpha'"); alpha's value is what resolves.
target: prod-01

services:
  alpha:
    type: environment
    environment:
      GREETER_GREETING: "from-alpha"
  greeter:
    type: demo
    greeting: "generated"

spec:
  greeting: "@GREETER_GREETING@"
