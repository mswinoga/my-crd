# The 'hello' greeter service generates HELLO_GREETER, but service
# 'alpha' already declares a variable of that name. Expect an "# ERROR:"
# ("already owned by service 'alpha'"); alpha's value is what resolves.
target: prod-01

services:
  alpha:
    type: environment
    environment:
      HELLO_GREETER: "from-alpha"
  hello:
    type: greeter
    greeting: "generated"

spec:
  greeter: "@HELLO_GREETER@"
