# Exercises every service-variable feature at once (all declared under
# services.app.environment):
#  - SCALAR_TOKEN: plain scalar, same in every env
#  - ENV_TOKEN: dict with a "default" fallback AND an env-specific override
#  - NO_DEFAULT_TOKEN: dict with no entry for env "prod" and no "default"
#    -> must produce an "# ERROR:" comment
#  - CHAINED_TOKEN: references two other tokens (one-level reference)
#  - AT_USAGE: exercises the built-in @AT@ -> "@" escape
#  - the "missingRefLooksLikeATypo" reference below points at a token
#    name that doesn't exist -> must produce a "# WARNING:" comment
#    (possible typo)
#  - DB_HOST/SIDECAR_TOKEN/BOTH_TOKEN: declare an accepted targetContainer
#    (main/side-car/both) -> exported by mycrd.integrations.services
#    under spec.services.app.environment, in addition to
#    resolving/substituting normally.
#  - worker: a second service exporting QUEUE (both) next to the
#    non-exported WORKER_TUNING -> spec.services.worker.
#  - NONE_TOKEN: explicit targetContainer: none -> excluded from
#    spec.services (same as SCALAR_TOKEN, which declares none at all).
target: prod-01

services:
  app:
    type: environment
    environment:
      SCALAR_TOKEN: "hello-world"
      ENV_TOKEN:
        default: "nonprod-value"
        prod: "prod-value"
      NO_DEFAULT_TOKEN:
        dev: "dev-only-value"
      CHAINED_TOKEN: "chain: @SCALAR_TOKEN@ + @ENV_TOKEN@"
      AT_USAGE: "literal at sign lives here: @AT@"
      DB_HOST:
        targetContainer: main
        default: "db.internal"
      SIDECAR_TOKEN:
        targetContainer: side-car
        default: "sidecar-value"
      BOTH_TOKEN:
        targetContainer: both
        default: "both-value"
      NONE_TOKEN:
        targetContainer: none
        default: "none-value"
  worker:
    type: environment
    environment:
      QUEUE:
        targetContainer: both
        default: "jobs"
        prod: "jobs-prod"
      WORKER_TUNING: "fast"

metadata:
  labels:
    team: platform-eng
    cost-center: "cc-@ENV_TOKEN@-1234"

spec:
  replicas: 3
  message: "@CHAINED_TOKEN@"
  atLiteral: "user@AT@example.com"
  missingRefLooksLikeATypo: "@THIS_TOKEN_DOES_NOT_EXIST@"
  brokenToken: "@NO_DEFAULT_TOKEN@"
  dbHost: "@DB_HOST@"
