# Direct two-variable cycle in a service: APP_A references APP_B, APP_B
# references APP_A. PROBE_VALUE uses APP_A. Expect an "# ERROR:" naming
# the cycle; the render must NOT hang.
target: prod-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_A: "@APP_B@"
        APP_B: "@APP_A@"
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@APP_A@"}
