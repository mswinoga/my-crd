# A variable declaring a crdkit-internal key (_generated). Expect a
# "# WARNING:" from crdkit's merge and the key removed: the injected
# generated value never resolves, the variable's own default does.
target: prod-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_LEAKY:
          default: "declared"
          _generated:
            prod-01: "injected"
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@APP_LEAKY@"}
