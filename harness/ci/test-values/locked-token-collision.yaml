# Consumer declares a service variable that collides with a systemTokens key
# (API_GROUP). Expect a "# WARNING:" comment, and the rendered value must
# be the LIBRARY's locked value, not the consumer's.
target: prod-01

services:
  app:
    type: environment
    environment:
      API_GROUP: "consumer-tries-to-override.example.com"

spec:
  group: "@API_GROUP@"
