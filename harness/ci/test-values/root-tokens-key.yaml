# A root 'tokens:' key. Expect a "# WARNING:" that it is not read:
# variables live under application.services.<ID>.environment, so
# @ROOT_TOKEN@ stays unresolved.
target: prod-01

tokens:
  ROOT_TOKEN: "ignored"

application:
  services:
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@ROOT_TOKEN@"}
