# A service variable with only a "default" entry, rendered against a
# target my-crd's escalation taxonomy (mycrd.parentTarget) recognizes
# but with no more specific override anywhere along the chain ->
# resolves to "default" via escalation (test-01 -> test -> TEST ->
# NONPROD -> default), with no diagnostics at all.
target: test-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_REGION:
          default: "us-east-1"
    PROBE:
      type: environment
      environment:
        PROBE_REGION: {targetContainer: main, default: "@APP_REGION@"}
