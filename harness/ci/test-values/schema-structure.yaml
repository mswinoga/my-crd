# Structural schema checks on the consumer values. Expect exactly:
#  - "# WARNING: 'application.extra' is not a known key — ignored";
#  - "# WARNING: 'application.services.HELLO.greetng' is not a known key
#    — ignored" (a typo next to a valid greeting);
#  - "# WARNING: 'application.services.PAUSED.greetng' is not a known key
#    — ignored" (a disabled service is checked too);
#  - "# WARNING: 'application.services.UNTYPED' has no 'type' — ignored";
#  - "# WARNING: 'metadata.labels.tier' must be a scalar — ignored";
#  - "# ERROR: key 'application.services.my-svc' must match
#    '^[A-Z0-9_]+$' — ignored" (the service is dropped);
#  - "# ERROR: key 'application.services.HELLO.environment.lower_var'
#    must match '^[A-Z][A-Z0-9_]*$' — ignored" (the variable is dropped;
#    the only message about it).
# The consumer chart's own root keys (global, frontend) raise nothing;
# HELLO renders with its enabled default and its greeting.
target: prod-01

global:
  imageRegistry: example.io
frontend:
  replicas: 3

metadata:
  labels:
    team: platform-eng
    tier: [a, b]

application:
  extra: true
  services:
    HELLO:
      type: greeter
      greeting: hi
      greetng: typo
      environment:
        lower_var: dropped
    PAUSED:
      type: greeter
      enabled: false
      greetng: typo
    UNTYPED:
      greeting: lost
    my-svc:
      type: environment
