# An empty target is not checked by itself: it only produces an ERROR
# once something resolves a token against it. my-crd's escalation
# taxonomy (mycrd.parentTarget) has nowhere to route an empty string, so
# the chain is exhausted immediately -> an ERROR, because PROBE_VALUE
# uses APP_BROKEN.
#
# Deliberately no "default:" key — "default" resolves regardless of
# target/taxonomy, which would defeat this fixture. "PROD" only
# resolves via escalation, which an empty target never reaches.
target: ""

application:
  services:
    APP:
      type: environment
      environment:
        APP_BROKEN:
          PROD: "unreachable-without-a-matching-rung"
    PROBE:
      type: environment
      environment:
        PROBE_VALUE:
          targetContainer: main
          PROD: "@APP_BROKEN@"
