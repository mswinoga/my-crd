# The greeter's generated variable is kept out of the output by a
# consumer declaration with targetContainer none. Expect an "# ERROR:"
# ("variable 'SVC1_GREETER' is not exported (targetContainer none) —
# dropped"); the file reference is still kept.
target: prod-01

services:
  SVC1:
    type: greeter
    greeting: hello
    environment:
      SVC1_GREETER:
        default: "internal"
        targetContainer: none
  SVC2:
    type: leader
    greeter: SVC1
