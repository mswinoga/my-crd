# Base example: a leader references the greeter's exported variable and
# the greeter's message file. Expect
# spec.application.services.SVC2.references =
# [/spec/application/services/SVC1/environment/SVC1_GREETER,
#  /spec/application/volumeMounts/SVC1-config/files/message] and no
# diagnostics.
target: prod-01

application:
  services:
    SVC1:
      type: greeter
      greeting: hello
    SVC2:
      type: leader
      greeter: SVC1
