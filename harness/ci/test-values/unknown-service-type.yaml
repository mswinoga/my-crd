# A service whose type is not in mycrd.serviceTypes. Expect a
# "# WARNING:" and the whole service skipped, its environment included:
# MYSTERY_GHOST is never declared, so its marker is left unresolved.
target: prod-01

application:
  services:
    MYSTERY:
      type: no-such-type
      environment:
        MYSTERY_GHOST: "never-declared"
    PROBE:
      type: environment
      environment:
        PROBE_GHOST: {targetContainer: main, default: "@MYSTERY_GHOST@"}
