# A variable with a targetContainer outside main/side-car/both/none.
# Expect an "# ERROR:" and the value corrected to "none" (the variable
# still resolves).
target: prod-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_BAD_CONTAINER:
          default: "still-resolves"
          targetContainer: sidecar-typo
    PROBE:
      type: environment
      environment:
        PROBE_VALUE: {targetContainer: main, default: "@APP_BAD_CONTAINER@"}
