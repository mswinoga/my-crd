# Value pass of the schema (per-target values, render target prod-01).
# Expect exactly:
#  - "# ERROR: 'application.services.HELLO.greeting' for target
#    'prod-01' must be a scalar" (a list for prod, a string by default);
# and nothing for PAUSED (disabled: not checked by the value pass), for
# APP_OK, nor for APP_LIST (a list variable, spliced into its marker as
# "a,b").
target: prod-01

application:
  services:
    HELLO:
      type: greeter
      greeting:
        default: hi
        prod: [a, b]
    PAUSED:
      type: greeter
      enabled: false
      greeting:
        default: hi
        prod: [a, b]
    APP:
      type: environment
      environment:
        APP_OK: fine
        APP_LIST:
          default: [a, b]
          targetContainer: main
