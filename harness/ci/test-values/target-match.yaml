# Exercises the "match:" tier — checked before every literal key,
# matched against the full "target" string (not just env):
#  - APP_SUBENV: only the "qam1"/"qap1" family, sequence 01-09, gets a
#    distinct value via match:; qa-01 (not qam1/qap1) falls through to
#    the NONPROD super-tier instead, silently, no diagnostic.
#  - APP_ENV_FROM_TARGET: derives "env" itself via a capture group,
#    purely to show the primitive; a consumer normally uses the
#    library's own @ENV@ token (see PROBE_BUILTIN_ENV).
target: qam1-01

application:
  services:
    APP:
      type: environment
      environment:
        APP_SUBENV:
          default: "generic"
          NONPROD: "nonprod-generic"
          match:
            - "qa[pm]1-0[1-9]": "canary"
        APP_ENV_FROM_TARGET:
          match:
            - "(.+)-[0-9]{2}": "$1"
    PROBE:
      type: environment
      environment:
        PROBE_SUBENV: {targetContainer: main, default: "@APP_SUBENV@"}
        PROBE_ENV_FROM_TARGET: {targetContainer: main, default: "@APP_ENV_FROM_TARGET@"}
        PROBE_BUILTIN_ENV: {targetContainer: main, default: "@ENV@"}
