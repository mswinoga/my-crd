# Input for tests/helpers_test.yaml (NOT scanned by `make dev`: it sets
# the probe key, so a plain render would print the probe document).
# mycrd.service.addFile called by two added services:
#  - shared-same: both add the file 'app.conf'      -> ERROR, a's kept
#  - shared-source: a creates it as configMap, b asks for secret
#                                                   -> ERROR, file not added
#  - shared-ok: a adds 'one.conf', b adds 'two.conf' -> both present
target: prod-01

application:
  services:
    A:
      type: environment
    B:
      type: environment

helpersProbe:
  calls:
    - {helper: add, params: {id: A}}
    - {helper: add, params: {id: B}}
    - {helper: addFile, params: {id: A, mount: shared-same, source: configMap, file: app.conf, content: "from a"}}
    - {helper: addFile, params: {id: B, mount: shared-same, source: configMap, file: app.conf, content: "from b"}}
    - {helper: addFile, params: {id: A, mount: shared-source, source: configMap, file: x.txt, content: "x"}}
    - {helper: addFile, params: {id: B, mount: shared-source, source: secret, file: y.txt, content: "y"}}
    - {helper: addFile, params: {id: A, mount: shared-ok, source: configMap, file: one.conf, content: "1"}}
    - {helper: addFile, params: {id: B, mount: shared-ok, source: configMap, file: two.conf, content: "2"}}
