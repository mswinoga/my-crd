{{- /*
Values reference as Markdown (crdkit.schema.document, md). Renders ONLY when
.Values.documentation is set; `make docs` writes `markdown` to VALUES.md.

Input:  documentation: true
Output: a YAML document { markdown: <the Markdown reference> }
*/ -}}
{{- if .Values.documentation }}
{{- $sections := include "harness.documentation.sections" . | fromYaml }}
{{- $diag := dict "errors" (list) "warnings" (list) }}
markdown: |
  {{- include "harness.documentation.document" (dict "root" . "format" "md" "sections" $sections "diag" $diag) | nindent 2 }}
{{- end }}
