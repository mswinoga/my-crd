# mycrd.service.* helpers called directly through
# harness/templates/helpers_probe.yaml (renders only when
# .Values.helpersProbe is set): the dispatcher always adds a service
# before its handler runs, so a helper call for a service that was never
# added is unreachable end to end.
suite: my-crd service helpers
templates:
  - helpers_probe.yaml
tests:
  - it: probe renders nothing when helpersProbe is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: probe - service.add writes the type and marks the service added
    set:
      services:
        app:
          type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: app}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              services:
                app:
                  type: environment
      - equal:
          path: registry.added
          value: {app: true}
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar after service.add exports the variable and records its owner
    set:
      services:
        app:
          type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: app}}
          - {helper: addVar, params: {id: app, name: ADDED, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              services:
                app:
                  type: environment
                  environment:
                    ADDED: {value: "@ADDED@", targetContainer: main}
      - equal:
          path: registry.owners
          value:
            /spec/services/app/environment/ADDED: app
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar with targetContainer none registers the token but does not export it
    set:
      services:
        app:
          type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: app}}
          - {helper: addVar, params: {id: app, name: INTERNAL, value: "v", targetContainer: none}}
          - {helper: addVar, params: {id: app, name: PLAIN, value: "v"}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              services:
                app:
                  type: environment
      - equal:
          path: registry.owners
          value: {}
      - exists:
          path: tokens.INTERNAL
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar for a service that was not added records an ERROR and changes nothing
    set:
      services:
        app:
          type: environment
      helpersProbe:
        calls:
          - {helper: addVar, params: {id: app, name: LOST, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: model
          value: {}
      - equal:
          path: tokens
          value: {}
      - equal:
          path: registry.owners
          value: {}
      - equal:
          path: diag.errors
          value:
            - "service 'app' was not added — helper 'mycrd.service.addVar' ignored"

  - it: probe - an added service does not make another service's helper call valid
    set:
      services:
        app:
          type: environment
        other:
          type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: app}}
          - {helper: addVar, params: {id: other, name: LOST, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "service 'other' was not added — helper 'mycrd.service.addVar' ignored"
      - notExists:
          path: model.spec.services.other

  - it: probe - addFile creates the mount with its source and records owner and contributor
    set:
      services:
        a:
          type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: a}}
          - {helper: addFile, params: {id: a, mount: m, source: configMap, file: app.conf, content: "@ENV@"}}
    asserts:
      - equal:
          path: model.spec.volumeMounts
          value:
            m:
              source: configMap
              files:
                app.conf: "@ENV@"
      - equal:
          path: registry.owners
          value:
            /spec/volumeMounts/m/files/app.conf: a
      - equal:
          path: registry.contributors
          value:
            /spec/volumeMounts/m: {a: true}
      - equal:
          path: diag.errors
          value: []

  - it: probe - addFile for a service that was not added records an ERROR and creates nothing
    set:
      services:
        a:
          type: environment
      helpersProbe:
        calls:
          - {helper: addFile, params: {id: a, mount: m, source: configMap, file: f, content: "x"}}
    asserts:
      - equal:
          path: model
          value: {}
      - equal:
          path: registry.contributors
          value: {}
      - equal:
          path: diag.errors
          value:
            - "service 'a' was not added — helper 'mycrd.service.addFile' ignored"

  - it: mount-conflicts - the same file from two services records an ERROR and keeps the first
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.volumeMounts.shared-same
          value:
            source: configMap
            files:
              app.conf: "from a"
      - contains:
          path: diag.errors
          content: "file 'app.conf' in mount 'shared-same' is already defined by service 'a'"
      - equal:
          path: registry.contributors["/spec/volumeMounts/shared-same"]
          value: {a: true}

  - it: mount-conflicts - a different source on a shared mount records an ERROR and the file is not added
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.volumeMounts.shared-source
          value:
            source: configMap
            files:
              x.txt: "x"
      - contains:
          path: diag.errors
          content: "mount 'shared-source' has source 'configMap', service 'b' asked for 'secret' — file 'y.txt' not added"
      - equal:
          path: registry.contributors["/spec/volumeMounts/shared-source"]
          value: {a: true}
      - notExists:
          path: registry.owners["/spec/volumeMounts/shared-source/files/y.txt"]

  - it: mount-conflicts - different files from two services share one mount and both contribute
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.volumeMounts.shared-ok
          value:
            source: configMap
            files:
              one.conf: "1"
              two.conf: "2"
      - equal:
          path: registry.contributors["/spec/volumeMounts/shared-ok"]
          value: {a: true, b: true}

  - it: mount-conflicts - exactly the two expected ERRORs are recorded, in call order
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: diag.errors
          value:
            - "file 'app.conf' in mount 'shared-same' is already defined by service 'a'"
            - "mount 'shared-source' has source 'configMap', service 'b' asked for 'secret' — file 'y.txt' not added"
