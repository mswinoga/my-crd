# mycrd.service.* helpers called directly through
# harness/templates/helpers_probe.yaml (renders only when
# .Values.helpersProbe is set): the dispatcher always adds a service
# before its handler runs, so a helper call for a service that was never
# added is unreachable end to end.
suite: my-crd service helpers
templates:
  - helpers_probe.yaml
tests:
  - it: probe renders nothing when helpersProbe is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: probe - service.add writes the type and marks the service added
    set:
      application:
        services:
          APP:
            type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: APP}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              application:
                services:
                  APP:
                    type: environment
      - equal:
          path: registry.added
          value: {APP: true}
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar after service.add exports the variable and records its owner
    set:
      application:
        services:
          APP:
            type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: APP}}
          - {helper: addVar, params: {id: APP, name: APP_ADDED, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              application:
                services:
                  APP:
                    type: environment
                    environment:
                      APP_ADDED: {value: "@APP_ADDED@", targetContainer: main}
      - equal:
          path: registry.owners
          value:
            /spec/application/services/APP/environment/APP_ADDED: APP
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar with targetContainer none registers the token but does not export it
    set:
      application:
        services:
          APP:
            type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: APP}}
          - {helper: addVar, params: {id: APP, name: APP_INTERNAL, value: "v", targetContainer: none}}
          - {helper: addVar, params: {id: APP, name: APP_PLAIN, value: "v"}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              application:
                services:
                  APP:
                    type: environment
      - equal:
          path: registry.owners
          value: {}
      - exists:
          path: tokens.APP_INTERNAL
      - equal:
          path: diag.errors
          value: []

  - it: probe - addVar for a service that was not added records an ERROR and changes nothing
    set:
      application:
        services:
          APP:
            type: environment
      helpersProbe:
        calls:
          - {helper: addVar, params: {id: APP, name: APP_LOST, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: model
          value: {}
      - equal:
          path: tokens
          value: {}
      - equal:
          path: registry.owners
          value: {}
      - equal:
          path: diag.errors
          value:
            - "service 'APP' was not added — helper 'mycrd.service.addVar' ignored"

  - it: probe - an added service does not make another service's helper call valid
    set:
      application:
        services:
          APP:
            type: environment
          OTHER:
            type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: APP}}
          - {helper: addVar, params: {id: OTHER, name: OTHER_LOST, value: "v", targetContainer: main}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "service 'OTHER' was not added — helper 'mycrd.service.addVar' ignored"
      - notExists:
          path: model.spec.application.services.OTHER

  - it: probe - addFile creates the mount with its source and records owner and contributor
    set:
      application:
        services:
          A:
            type: environment
      helpersProbe:
        calls:
          - {helper: add, params: {id: A}}
          - {helper: addFile, params: {id: A, mount: m, source: configMap, file: app.conf, content: "@ENV@"}}
    asserts:
      - equal:
          path: model.spec.application.volumeMounts
          value:
            m:
              source: configMap
              files:
                app.conf: "@ENV@"
      - equal:
          path: registry.owners
          value:
            /spec/application/volumeMounts/m/files/app.conf: A
      - equal:
          path: registry.contributors
          value:
            /spec/application/volumeMounts/m: {A: true}
      - equal:
          path: diag.errors
          value: []

  - it: probe - addFile for a service that was not added records an ERROR and creates nothing
    set:
      application:
        services:
          A:
            type: environment
      helpersProbe:
        calls:
          - {helper: addFile, params: {id: A, mount: m, source: configMap, file: f, content: "x"}}
    asserts:
      - equal:
          path: model
          value: {}
      - equal:
          path: registry.contributors
          value: {}
      - equal:
          path: diag.errors
          value:
            - "service 'A' was not added — helper 'mycrd.service.addFile' ignored"

  - it: mount-conflicts - the same file from two services records an ERROR and keeps the first
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.application.volumeMounts.shared-same
          value:
            source: configMap
            files:
              app.conf: "from a"
      - contains:
          path: diag.errors
          content: "file 'app.conf' in mount 'shared-same' is already defined by service 'A'"
      - equal:
          path: registry.contributors["/spec/application/volumeMounts/shared-same"]
          value: {A: true}

  - it: mount-conflicts - a different source on a shared mount records an ERROR and the file is not added
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.application.volumeMounts.shared-source
          value:
            source: configMap
            files:
              x.txt: "x"
      - contains:
          path: diag.errors
          content: "mount 'shared-source' has source 'configMap', service 'B' asked for 'secret' — file 'y.txt' not added"
      - equal:
          path: registry.contributors["/spec/application/volumeMounts/shared-source"]
          value: {A: true}
      - notExists:
          path: registry.owners["/spec/application/volumeMounts/shared-source/files/y.txt"]

  - it: mount-conflicts - different files from two services share one mount and both contribute
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: model.spec.application.volumeMounts.shared-ok
          value:
            source: configMap
            files:
              one.conf: "1"
              two.conf: "2"
      - equal:
          path: registry.contributors["/spec/application/volumeMounts/shared-ok"]
          value: {A: true, B: true}

  - it: mount-conflicts - exactly the two expected ERRORs are recorded, in call order
    values:
      - ../harness/ci/probe-values/mount-conflicts.yaml
    asserts:
      - equal:
          path: diag.errors
          value:
            - "file 'app.conf' in mount 'shared-same' is already defined by service 'A'"
            - "mount 'shared-source' has source 'configMap', service 'B' asked for 'secret' — file 'y.txt' not added"

  - it: probe - service.enabled with enabled absent returns true
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {}}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled with enabled true returns true
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {enabled: true}}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled with enabled false returns exactly the empty string
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {enabled: false}}}
    asserts:
      - equal:
          path: results[0]
          value: ""
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled with enabled the string "false" returns true
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {enabled: "false"}}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled with enabled 0 returns true
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {enabled: 0}}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled with enabled a non-boolean string returns true
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: {enabled: no-way}}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.enabled treats a non-map declaration as enabled and records nothing
    set:
      helpersProbe:
        calls:
          - {helper: enabled, params: {id: APP, service: "text"}}
    asserts:
      - equal:
          path: results[0]
          value: "true"
      - equal:
          path: registry
          value: {}

  - it: probe - service.value resolves a per-target field for ctx.target and for an explicit target
    set:
      application:
        services:
          HELLO:
            type: greeter
            greeting: {default: hi, prod: hello-prod}
      helpersProbe:
        calls:
          - {helper: add, params: {id: HELLO}}
          - {helper: value, params: {id: HELLO, field: [greeting]}}
          - {helper: value, params: {id: HELLO, field: [greeting], target: dev-01}}
          - {helper: value, params: {id: HELLO, field: [type]}}
          - {helper: value, params: {id: HELLO, field: [nothing]}}
    asserts:
      - equal:
          path: results
          value:
            - ""
            - "value:\n  hello-prod"
            - "value:\n  hi"
            - "value:\n  greeter"
            - "value:\n  null"
      - equal:
          path: diag
          value: {errors: [], warnings: []}

  - it: probe - service.value records an ERROR naming the target it resolved for
    set:
      application:
        services:
          HELLO:
            type: greeter
            greeting: {default: hi, dev: [a, b]}
      helpersProbe:
        calls:
          - {helper: add, params: {id: HELLO}}
          - {helper: value, params: {id: HELLO, field: [greeting], target: dev-01}}
          - {helper: value, params: {id: HELLO, field: [greeting]}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'application.services.HELLO.greeting' for target 'dev-01' must be a scalar"
      - equal:
          path: registry.validated
          value:
            application.services.HELLO.greeting|dev-01: true
            application.services.HELLO.greeting|prod-01: true

  - it: probe - the same (path, target) from service.value and the value pass is reported once
    set:
      application:
        services:
          HELLO:
            type: greeter
            greeting: {default: [a, b]}
      helpersProbe:
        schema: true
        calls:
          - {helper: add, params: {id: HELLO}}
          - {helper: value, params: {id: HELLO, field: [greeting]}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'application.services.HELLO.greeting' for target 'prod-01' must be a scalar"

  - it: probe - service.value for a service that was not added records the guard ERROR
    set:
      application:
        services:
          HELLO:
            type: greeter
            greeting: hi
      helpersProbe:
        calls:
          - {helper: value, params: {id: HELLO, field: [greeting]}}
    asserts:
      - equal:
          path: results
          value: ["value:\n  null"]
      - equal:
          path: diag.errors
          value:
            - "service 'HELLO' was not added — helper 'mycrd.service.value' ignored"

  - it: probe - fieldMarkers rewrites relative markers and @.@ in every string leaf, keys and non-strings untouched
    set:
      helpersProbe:
        fieldMarkers:
          - id: SVC1
            value: "http://@.host@/@.instance@:@.port@"
          - id: SVC1
            value:
              "@.key@": "@.tls.cert@"
              list: ["@.a@", 3, true, {deep: "x-@.b@"}]
          - id: SVC1
            value:
              default: "@.instance@"
              prod: "p-@.instance@"
              match:
                - "qa-(.*)": "qa-$1-@.host@"
              targetContainer: main
          - id: SVC1
            value: "user@AT@example.com @.@ @AT@.x@AT@ plain @ENV@ @OTHER.x@"
          - id: SVC1
            value: 5
          - id: SVC1
            value: false
    asserts:
      - equal:
          path: fieldMarkers
          value:
            - "http://@SVC1.host@/@SVC1.instance@:@SVC1.port@"
            - "@.key@": "@SVC1.tls.cert@"
              list: ["@SVC1.a@", 3, true, {deep: "x-@SVC1.b@"}]
            - default: "@SVC1.instance@"
              prod: "p-@SVC1.instance@"
              match:
                - "qa-(.*)": "qa-$1-@SVC1.host@"
              targetContainer: main
            - "user@AT@example.com SVC1 @AT@.x@AT@ plain @ENV@ @OTHER.x@"
            - 5
            - false

  - it: probe - serviceFields declares field tokens by node type and rewrites enabled services only
    set:
      helpersProbe:
        serviceFields:
          schema:
            type: map
            properties:
              application:
                type: map
                properties:
                  services:
                    type: map
                    values:
                      type: map
                      properties:
                        type: {type: string, static: true}
                        enabled: {type: bool, static: true}
                        environment: {type: map, values: {type: scalar}}
                        name: {type: string}
                        port: {type: int}
                        hosts: {type: list, items: {type: string}}
                        extra: {type: any}
                        tls:
                          type: map
                          properties:
                            cert: {type: string}
                            opts: {type: map, values: {type: scalar}}
                        unset: {type: string}
          input:
            application:
              services:
                SVC1:
                  type: t
                  enabled: true
                  name: {default: "n-@.port@", prod: p, targetContainer: main, service: SVC1}
                  port: 80
                  hosts: ["@.name@", b]
                  extra: {k: "@.name@"}
                  tls:
                    cert: "c-@.name@"
                    opts: {a: 1}
                  environment:
                    SVC1_X: "@.tls.cert@"
                OFF:
                  type: t
                  enabled: false
                  name: "@.port@"
                  port: 1
    asserts:
      - equal:
          path: serviceFields.tokens
          value:
            SVC1.name: {default: "n-@SVC1.port@", prod: p}
            SVC1.port: {default: 80}
            SVC1.hosts: {default: ["@SVC1.name@", b]}
            SVC1.extra: {default: {k: "@SVC1.name@"}}
            SVC1.tls.cert: {default: "c-@SVC1.name@"}
            SVC1.tls.opts.a: {default: 1}
      - equal:
          path: serviceFields.input.application.services.SVC1.environment
          value: {SVC1_X: "@SVC1.tls.cert@"}
      - equal:
          path: serviceFields.input.application.services.OFF
          value: {type: t, enabled: false, name: "@.port@", port: 1}

  - it: probe - service.value returns a field reference into an int field as an int
    set:
      application:
        services:
          DB:
            type: db
            instance: i1
            host: "6543"
            port: "@.host@"
      helpersProbe:
        fields: true
        calls:
          - {helper: add, params: {id: DB}}
          - {helper: value, params: {id: DB, field: [port]}}
          - {helper: value, params: {id: DB, field: [password]}}
    asserts:
      - equal:
          path: results[1]
          value: "value:\n  6543"
      - equal:
          path: results[2]
          value: "value:\n  secret://i1/password"
      - equal:
          path: diag.errors
          value: []

  - it: probe - a field reference that does not parse as the int field's type is an ERROR, returned as a string
    set:
      application:
        services:
          DB:
            type: db
            instance: i1
            host: h1
            port: "@.host@"
      helpersProbe:
        fields: true
        calls:
          - {helper: add, params: {id: DB}}
          - {helper: value, params: {id: DB, field: [port]}}
    asserts:
      - equal:
          path: results[1]
          value: "value:\n  h1"
      - equal:
          path: diag.errors
          value:
            - "'application.services.DB.port' for target 'prod-01' must be of type 'int' — got 'h1'"

  - it: probe - addVar and addFile rewrite relative markers for their service
    set:
      application:
        services:
          DB:
            type: db
            instance: i1
            host: h1
            port: 5432
      helpersProbe:
        fields: true
        calls:
          - {helper: add, params: {id: DB}}
          - {helper: addVar, params: {id: DB, name: DB_HOST, value: "@.host@", targetContainer: main}}
          - {helper: addFile, params: {id: DB, mount: DB-config, source: configMap, file: dsn, content: "@.host@:@.port@/@.instance@"}}
    asserts:
      - equal:
          path: tokens.DB_HOST._generated
          value: {prod-01: "@DB.host@"}
      - equal:
          path: model.spec.application.volumeMounts.DB-config.files.dsn
          value: "@DB.host@:@DB.port@/@DB.instance@"
      - exists:
          path: tokens["DB.host"]
      - equal:
          path: diag.errors
          value: []

  - it: probe - templates finds direct, transitive and per-target templates, not plain library tokens
    set:
      helpersProbe:
        templates:
          system:
            A_LAST: "a/@B_MID@"
            B_MID: {default: "b", prod: "b/@C_DIRECT@"}
            C_DIRECT: "c/@.instance@/@.bucket@"
            PLAIN: "@ENV@/@LOG_LEVEL@"
            ESCAPED: "@AT@.instance@AT@"
            ID_ONLY: "svc/@.@"
          defaults:
            PER_TARGET: {default: "d", prod: "p-@.bucket@"}
            LOG_LEVEL: info
    asserts:
      - equal:
          path: templates
          value: [A_LAST, B_MID, C_DIRECT, ID_ONLY, PER_TARGET]

  - it: probe - templateMarkers rewrites markers to templates only, escapes and other markers untouched
    set:
      helpersProbe:
        templateMarkers:
          - id: SVC
            templates: [T1, T2]
            value: "@T1@/@T2@/@ENV@/@AT@T1@AT@/@SVC.x@"
          - id: SVC
            templates: [T1]
            value: {default: "@T1@", list: ["@T1@", 1], n: 2}
    asserts:
      - equal:
          path: templateMarkers
          value:
            - "@SVC..T1@/@SVC..T2@/@ENV@/@AT@T1@AT@/@SVC.x@"
            - {default: "@SVC..T1@", list: ["@SVC..T1@", 1], n: 2}

  - it: probe - serviceFields declares a bound copy of every template per enabled service
    set:
      application:
        services:
          DB1:
            type: db
            instance: i1
            host: h1
            port: 1
          DB2:
            type: db
            enabled: false
            instance: i2
            host: h2
            port: 2
      helpersProbe:
        fields: true
        library:
          system:
            DB_PATH: "@.instance@/@.host@"
            DB_SECRET: {default: "secret://@DB_PATH@", prod: "p://@DB_PATH@", targetContainer: main, service: X}
            PLAIN: "@ENV@"
            DB_NAME: "@.@-db"
        resolve: [DB1..DB_SECRET]
    asserts:
      - equal:
          path: tokens["DB1..DB_PATH"].default
          value: "@DB1.instance@/@DB1.host@"
      - equal:
          path: tokens["DB1..DB_SECRET"].default
          value: "secret://@DB1..DB_PATH@"
      - equal:
          path: tokens["DB1..DB_SECRET"].prod
          value: "p://@DB1..DB_PATH@"
      - notExists:
          path: tokens["DB1..DB_SECRET"].targetContainer
      - notExists:
          path: tokens["DB1..DB_SECRET"].service
      - equal:
          path: tokens["DB1..DB_NAME"].default
          value: "DB1-db"
      - notExists:
          path: tokens["DB1..PLAIN"]
      - notExists:
          path: tokens["DB2..DB_PATH"]
      - notExists:
          path: tokens["DB2..DB_SECRET"]
      - equal:
          path: resolved["DB1..DB_SECRET"]
          value: "p://i1/h1"
      - equal:
          path: diag.errors
          value: []

  - it: probe - serviceFields with library declarations returns the template list and leaves services without templates alone
    set:
      helpersProbe:
        serviceFields:
          schema:
            type: map
            properties:
              application:
                type: map
                properties:
                  services:
                    type: map
                    values:
                      type: map
                      properties:
                        type: {type: string, static: true}
                        name: {type: string}
          input:
            application:
              services:
                SVC1: {type: t, name: n}
          system:
            T: "@.name@"
          defaults:
            NOT_T: "x"
    asserts:
      - equal:
          path: serviceFields.templates
          value: [T]
      - equal:
          path: serviceFields.tokens
          value:
            SVC1.name: {default: n}
            SVC1..T: {default: "@SVC1.name@"}

  - it: probe - addVar and addFile rewrite markers to library templates to the service's copy
    set:
      application:
        services:
          DB1:
            type: db
            instance: i1
            host: h1
            port: 1
          DB2:
            type: db
            instance: i2
            host: h2
            port: 2
      helpersProbe:
        fields: true
        library:
          system:
            DB_PATH: "@.instance@/@.host@"
            PLAIN: "plain"
        calls:
          - {helper: add, params: {id: DB1}}
          - {helper: add, params: {id: DB2}}
          - {helper: addVar, params: {id: DB1, name: DB1_PATH, value: "@DB_PATH@|@PLAIN@", targetContainer: main}}
          - {helper: addVar, params: {id: DB2, name: DB2_PATH, value: "@DB_PATH@", targetContainer: main}}
          - {helper: addFile, params: {id: DB2, mount: DB2-config, source: configMap, file: path, content: "@DB_PATH@ @AT@DB_PATH@AT@"}}
        resolve: [DB1_PATH, DB2_PATH]
    asserts:
      - equal:
          path: tokens.DB1_PATH._generated
          value: {prod-01: "@DB1..DB_PATH@|@PLAIN@"}
      - equal:
          path: tokens.DB2_PATH._generated
          value: {prod-01: "@DB2..DB_PATH@"}
      - equal:
          path: model.spec.application.volumeMounts.DB2-config.files.path
          value: "@DB2..DB_PATH@ @AT@DB_PATH@AT@"
      - equal:
          path: resolved.DB1_PATH
          value: "i1/h1|@PLAIN@"
      - equal:
          path: resolved.DB2_PATH
          value: "i2/h2"
