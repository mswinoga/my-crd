# services.<ID>.environment -> tokens (mycrd.serviceTokens), service
# registration and output (mycrd.service.*, mycrd.integrations.services).
# Assertions on resolved values and output shape only; diagnostic
# comments are covered by diagnostics_test.sh. Helper behavior that no
# end-to-end input reaches is in helpers_test.yaml.
suite: my-crd services
templates:
  - call.yaml
tests:
  - it: a scalar variable of an environment service resolves through @NAME@
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            GREETING: "hello"
      spec.m: "@GREETING@"
    asserts:
      - equal:
          path: spec.m
          value: "hello"

  - it: a dict variable resolves its target-specific entry for a sequenced target
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            COLOR:
              default: "blue"
              prod: "red"
      spec.m: "@COLOR@"
    asserts:
      - equal:
          path: spec.m
          value: "red"

  - it: a dict variable falls back to default for a target without a specific entry
    set:
      target: test-01
      services:
        app:
          type: environment
          environment:
            COLOR:
              default: "blue"
              prod: "red"
      spec.m: "@COLOR@"
    asserts:
      - equal:
          path: spec.m
          value: "blue"

  - it: a variable declared by two services keeps the alphabetically first service's value
    set:
      target: prod-01
      services:
        zeta:
          type: environment
          environment:
            SHARED: "from-zeta"
        alpha:
          type: environment
          environment:
            SHARED: "from-alpha"
      spec.m: "@SHARED@"
    asserts:
      - equal:
          path: spec.m
          value: "from-alpha"

  - it: variables of a service with an unknown type are not declared (marker stays unresolved)
    set:
      target: prod-01
      services:
        mystery:
          type: no-such-type
          environment:
            GHOST: "never"
      spec.m: "@GHOST@"
    asserts:
      - equal:
          path: spec.m
          value: "@GHOST@"

  - it: variables of a service without a type are not declared
    set:
      target: prod-01
      services:
        typeless:
          environment:
            GHOST: "never"
      spec.m: "@GHOST@"
    asserts:
      - equal:
          path: spec.m
          value: "@GHOST@"

  - it: variables of different services can reference each other
    values:
      - ../harness/ci/test-values/services-basic.yaml
    asserts:
      - equal:
          path: spec.dsn
          value: "postgres://db.prod/orders?pool=10"
      - equal:
          path: spec.currency
          value: "EUR"

  - it: a service without an environment block is accepted
    set:
      target: prod-01
      services:
        bare:
          type: environment
      spec.m: "ok"
    asserts:
      - equal:
          path: spec.m
          value: "ok"

  - it: an invalid targetContainer is corrected without losing the variable's value
    values:
      - ../harness/ci/test-values/invalid-target-container.yaml
    asserts:
      - equal:
          path: spec.value
          value: "still-resolves"

  - it: an explicit 'service' key on a variable does not prevent resolution
    values:
      - ../harness/ci/test-values/explicit-service-key.yaml
    asserts:
      - equal:
          path: spec.value
          value: "v"

  - it: a consumer scalar overriding a library default replaces its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL: "debug"
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "debug"

  - it: a consumer dict variable overriding a library default keeps the library default for other targets
    set:
      target: test-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              prod: "debug"
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "info"

  - it: a root 'tokens:' key declares nothing (marker stays unresolved)
    set:
      target: prod-01
      tokens.X: "v"
      spec.m: "@X@"
    asserts:
      - equal:
          path: spec.m
          value: "@X@"

  - it: exporting a library default (LOG_LEVEL with targetContainer) keeps the library value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              targetContainer: main
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "info"

  - it: a consumer value on a library default still overrides it when annotations are also given
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              default: "warn"
              targetContainer: main
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "warn"

  - it: a consumer declaration of a locked library token (ENV) cannot change its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            ENV:
              prod: "x"
      spec.m: "@ENV@"
    asserts:
      - equal:
          path: spec.m
          value: "prod"

  - it: a scalar consumer declaration of a locked library token cannot change its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            API_GROUP: "hijacked.example.com"
      spec.m: "@API_GROUP@"
    asserts:
      - equal:
          path: spec.m
          value: "platform.company.io"

  - it: the library-token-export fixture keeps both library values
    values:
      - ../harness/ci/test-values/library-token-export.yaml
    asserts:
      - equal:
          path: spec.level
          value: "info"
      - equal:
          path: spec.env
          value: "prod"

  - it: a demo service generates <ID>_GREETING from its greeting
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi @ENV@"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "hi prod"

  - it: a consumer's target entry for the generated variable overrides it
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi"
          environment:
            GREETER_GREETING:
              prod: "custom"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "custom"

  - it: a consumer's default for the generated variable beats the generated value
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi"
          environment:
            GREETER_GREETING: "mine"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "mine"

  - it: a consumer's entry for another target does not hide the generated value
    set:
      target: test-01
      services:
        greeter:
          type: demo
          greeting: "generated"
          environment:
            GREETER_GREETING:
              prod: "custom"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "generated"

  - it: a service ID with a hyphen yields an underscored variable name
    set:
      target: prod-01
      services:
        my-greeter:
          type: demo
          greeting: "hello"
      spec.g: "@MY_GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "hello"

  - it: each demo service generates its own variable
    set:
      target: prod-01
      services:
        b:
          type: demo
          greeting: "from b"
        a:
          type: demo
          greeting: "from a"
      spec.a: "@A_GREETING@"
      spec.b: "@B_GREETING@"
    asserts:
      - equal:
          path: spec.a
          value: "from a"
      - equal:
          path: spec.b
          value: "from b"

  - it: a demo service without greeting generates nothing
    set:
      target: prod-01
      services:
        quiet:
          type: demo
      spec.g: "@QUIET_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "@QUIET_GREETING@"

  - it: a service of unknown type generates nothing even if it has a greeting
    set:
      target: prod-01
      services:
        ghost:
          type: no-such-type
          greeting: "boo"
      spec.g: "@GHOST_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "@GHOST_GREETING@"

  - it: a generated variable owned by another service does not replace the owner's value
    values:
      - ../harness/ci/test-values/generated-owner-conflict.yaml
    asserts:
      - equal:
          path: spec.greeting
          value: "from-alpha"

  - it: the demo-service fixture resolves its generated greeting
    values:
      - ../harness/ci/test-values/demo-service.yaml
    asserts:
      - equal:
          path: spec.greeting
          value: "hi prod"

  - it: crdkit-internal keys in a consumer variable are dropped (no injected generated value)
    values:
      - ../harness/ci/test-values/internal-key.yaml
    asserts:
      - equal:
          path: spec.value
          value: "declared"

  - it: a service declared as a non-map is skipped while its valid sibling still resolves
    values:
      - ../harness/ci/test-values/malformed-service.yaml
    asserts:
      - equal:
          path: spec.dbHost
          value: "db.internal"
      - notExists:
          path: spec.services.broken

  - it: a non-map environment is ignored while the demo handler still generates its variable
    values:
      - ../harness/ci/test-values/malformed-environment.yaml
    asserts:
      - equal:
          path: spec.greeting
          value: "hi"
      - equal:
          path: spec.services.greeter.environment.GREETER_GREETING.value
          value: "hi"

  # ---- service output: spec.services.<ID> ----

  - it: spec.variables is not rendered
    template: call.yaml
    values:
      - ../harness/ci/test-values/full-featured.yaml
    asserts:
      - exists:
          path: spec.variables
        not: true

  - it: a service with exported variables appears with its type and the resolved value
    template: call.yaml
    values:
      - ../harness/ci/test-values/services-basic.yaml
    asserts:
      - equal:
          path: spec.services.orders
          value:
            type: environment
            environment:
              DB_HOST:
                value: "db.prod"
                targetContainer: main

  - it: a service without exported variables appears with its type only
    template: call.yaml
    values:
      - ../harness/ci/test-values/services-basic.yaml
    asserts:
      - equal:
          path: spec.services.billing
          value:
            type: environment

  - it: no spec.services at all when no service is declared
    template: call.yaml
    values:
      - ../harness/ci/test-values/minimal.yaml
    asserts:
      - exists:
          path: spec.services
        not: true

  - it: every dispatched service appears in spec.services, exported variables or not
    template: call.yaml
    set:
      target: prod-01
      services:
        quiet:
          type: environment
        loud:
          type: environment
          environment:
            LOUD: {default: "x", targetContainer: main}
    asserts:
      - equal:
          path: spec.services.quiet
          value:
            type: environment
      - equal:
          path: spec.services.loud.environment.LOUD
          value:
            value: "x"
            targetContainer: main

  - it: a service with an unknown type is not dispatched and does not appear
    template: call.yaml
    set:
      target: prod-01
      services:
        mystery:
          type: no-such-type
    asserts:
      - exists:
          path: spec.services
        not: true

  - it: an exported library default (LOG_LEVEL) is attributed to the declaring service
    template: call.yaml
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              targetContainer: main
    asserts:
      - equal:
          path: spec.services.app.environment.LOG_LEVEL
          value:
            value: "info"
            targetContainer: main

  - it: an exported locked library token (ENV) is attributed to the declaring service with the library value
    template: call.yaml
    values:
      - ../harness/ci/test-values/library-token-export.yaml
    asserts:
      - equal:
          path: spec.services.app.environment.ENV
          value:
            value: "prod"
            targetContainer: both

  - it: a generated variable of a demo service is exported under that service
    template: call.yaml
    values:
      - ../harness/ci/test-values/demo-service.yaml
    asserts:
      - equal:
          path: spec.services.greeter
          value:
            type: demo
            environment:
              GREETER_GREETING:
                value: "hi prod"
                targetContainer: main

  - it: variables of different services are grouped per service
    template: call.yaml
    set:
      target: prod-01
      services:
        a:
          type: environment
          environment:
            A_VAR: {default: "1", targetContainer: main}
            A_TWO: {default: "2", targetContainer: both}
        b:
          type: environment
          environment:
            B_VAR: {default: "3", targetContainer: side-car}
    asserts:
      - equal:
          path: spec.services
          value:
            a:
              type: environment
              environment:
                A_TWO: {value: "2", targetContainer: both}
                A_VAR: {value: "1", targetContainer: main}
            b:
              type: environment
              environment:
                B_VAR: {value: "3", targetContainer: side-car}

  - it: the full-featured fixture exports variables of two services separately
    template: call.yaml
    values:
      - ../harness/ci/test-values/full-featured.yaml
    asserts:
      - equal:
          path: spec.services.worker
          value:
            type: environment
            environment:
              QUEUE:
                value: "jobs-prod"
                targetContainer: both

  - it: a variable with a corrected (invalid) targetContainer is not exported
    template: call.yaml
    values:
      - ../harness/ci/test-values/invalid-target-container.yaml
    asserts:
      - equal:
          path: spec.services.app
          value:
            type: environment

  - it: the consumer's own spec keys survive next to spec.services
    template: call.yaml
    values:
      - ../harness/ci/test-values/services-basic.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
