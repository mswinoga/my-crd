# services.<ID>.environment -> tokens (mycrd.serviceTokens). Assertions
# on resolved values only; diagnostic comments are covered by
# diagnostics_test.sh.
suite: my-crd services
templates:
  - call.yaml
tests:
  - it: a scalar variable of an environment service resolves through @NAME@
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            GREETING: "hello"
      spec.m: "@GREETING@"
    asserts:
      - equal:
          path: spec.m
          value: "hello"

  - it: a dict variable resolves its target-specific entry for a sequenced target
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            COLOR:
              default: "blue"
              prod: "red"
      spec.m: "@COLOR@"
    asserts:
      - equal:
          path: spec.m
          value: "red"

  - it: a dict variable falls back to default for a target without a specific entry
    set:
      target: test-01
      services:
        app:
          type: environment
          environment:
            COLOR:
              default: "blue"
              prod: "red"
      spec.m: "@COLOR@"
    asserts:
      - equal:
          path: spec.m
          value: "blue"

  - it: a variable declared by two services keeps the alphabetically first service's value
    set:
      target: prod-01
      services:
        zeta:
          type: environment
          environment:
            SHARED: "from-zeta"
        alpha:
          type: environment
          environment:
            SHARED: "from-alpha"
      spec.m: "@SHARED@"
    asserts:
      - equal:
          path: spec.m
          value: "from-alpha"

  - it: variables of a service with an unknown type are not declared (marker stays unresolved)
    set:
      target: prod-01
      services:
        mystery:
          type: no-such-type
          environment:
            GHOST: "never"
      spec.m: "@GHOST@"
    asserts:
      - equal:
          path: spec.m
          value: "@GHOST@"

  - it: variables of a service without a type are not declared
    set:
      target: prod-01
      services:
        typeless:
          environment:
            GHOST: "never"
      spec.m: "@GHOST@"
    asserts:
      - equal:
          path: spec.m
          value: "@GHOST@"

  - it: variables of different services can reference each other
    values:
      - ../harness/ci/test-values/services-basic.yaml
    asserts:
      - equal:
          path: spec.dsn
          value: "postgres://db.prod/orders?pool=10"
      - equal:
          path: spec.currency
          value: "EUR"

  - it: a service without an environment block is accepted
    set:
      target: prod-01
      services:
        bare:
          type: environment
      spec.m: "ok"
    asserts:
      - equal:
          path: spec.m
          value: "ok"

  - it: an invalid targetContainer is corrected without losing the variable's value
    values:
      - ../harness/ci/test-values/invalid-target-container.yaml
    asserts:
      - equal:
          path: spec.value
          value: "still-resolves"

  - it: an explicit 'service' key on a variable does not prevent resolution
    values:
      - ../harness/ci/test-values/explicit-service-key.yaml
    asserts:
      - equal:
          path: spec.value
          value: "v"

  - it: a consumer scalar overriding a library default replaces its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL: "debug"
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "debug"

  - it: a consumer dict variable overriding a library default keeps the library default for other targets
    set:
      target: test-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              prod: "debug"
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "info"

  - it: a root 'tokens:' key declares nothing (marker stays unresolved)
    set:
      target: prod-01
      tokens.X: "v"
      spec.m: "@X@"
    asserts:
      - equal:
          path: spec.m
          value: "@X@"

  - it: exporting a library default (LOG_LEVEL with targetContainer) keeps the library value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              targetContainer: main
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "info"

  - it: a consumer value on a library default still overrides it when annotations are also given
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            LOG_LEVEL:
              default: "warn"
              targetContainer: main
      spec.m: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: spec.m
          value: "warn"

  - it: a consumer declaration of a locked library token (ENV) cannot change its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            ENV:
              prod: "x"
      spec.m: "@ENV@"
    asserts:
      - equal:
          path: spec.m
          value: "prod"

  - it: a scalar consumer declaration of a locked library token cannot change its value
    set:
      target: prod-01
      services:
        app:
          type: environment
          environment:
            API_GROUP: "hijacked.example.com"
      spec.m: "@API_GROUP@"
    asserts:
      - equal:
          path: spec.m
          value: "platform.company.io"

  - it: the library-token-export fixture keeps both library values
    values:
      - ../harness/ci/test-values/library-token-export.yaml
    asserts:
      - equal:
          path: spec.level
          value: "info"
      - equal:
          path: spec.env
          value: "prod"

  - it: a demo service generates <ID>_GREETING from its greeting
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi @ENV@"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "hi prod"

  - it: a consumer's target entry for the generated variable overrides it
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi"
          environment:
            GREETER_GREETING:
              prod: "custom"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "custom"

  - it: a consumer's default for the generated variable beats the generated value
    set:
      target: prod-01
      services:
        greeter:
          type: demo
          greeting: "hi"
          environment:
            GREETER_GREETING: "mine"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "mine"

  - it: a consumer's entry for another target does not hide the generated value
    set:
      target: test-01
      services:
        greeter:
          type: demo
          greeting: "generated"
          environment:
            GREETER_GREETING:
              prod: "custom"
      spec.g: "@GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "generated"

  - it: a service ID with a hyphen yields an underscored variable name
    set:
      target: prod-01
      services:
        my-greeter:
          type: demo
          greeting: "hello"
      spec.g: "@MY_GREETER_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "hello"

  - it: each demo service generates its own variable
    set:
      target: prod-01
      services:
        b:
          type: demo
          greeting: "from b"
        a:
          type: demo
          greeting: "from a"
      spec.a: "@A_GREETING@"
      spec.b: "@B_GREETING@"
    asserts:
      - equal:
          path: spec.a
          value: "from a"
      - equal:
          path: spec.b
          value: "from b"

  - it: a demo service without greeting generates nothing
    set:
      target: prod-01
      services:
        quiet:
          type: demo
      spec.g: "@QUIET_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "@QUIET_GREETING@"

  - it: a service of unknown type generates nothing even if it has a greeting
    set:
      target: prod-01
      services:
        ghost:
          type: no-such-type
          greeting: "boo"
      spec.g: "@GHOST_GREETING@"
    asserts:
      - equal:
          path: spec.g
          value: "@GHOST_GREETING@"

  - it: a generated variable owned by another service does not replace the owner's value
    values:
      - ../harness/ci/test-values/generated-owner-conflict.yaml
    asserts:
      - equal:
          path: spec.greeting
          value: "from-alpha"

  - it: the demo-service fixture resolves its generated greeting
    values:
      - ../harness/ci/test-values/demo-service.yaml
    asserts:
      - equal:
          path: spec.greeting
          value: "hi prod"
