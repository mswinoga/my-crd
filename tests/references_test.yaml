# Service references: recorded by the service helpers, validated and
# written by mycrd.integrations.references. End-to-end cases go through
# mycrd.render (call.yaml); cases no service type can produce (self,
# whole nodes, cycles, duplicates, late targets) go through
# harness/templates/helpers_probe.yaml with fixtures from
# harness/ci/probe-values/. Diagnostic comments are covered by
# diagnostics_test.sh; the probe exposes `diag` as data.
suite: my-crd references
templates:
  - call.yaml
  - helpers_probe.yaml
tests:
  # ---- end to end ----

  - it: the base example renders the output of the spec
    template: call.yaml
    values:
      - ../harness/ci/test-values/references-basic.yaml
    asserts:
      - equal:
          path: spec.application.services
          value:
            SVC1:
              type: greeter
              environment:
                SVC1_GREETER:
                  value: SVC1
                  targetContainer: main
            SVC2:
              type: leader
              environment:
                SVC2_SEED:
                  value: "5"
                  targetContainer: main
              references:
                - /spec/application/services/SVC1/environment/SVC1_GREETER
                - /spec/application/volumeMounts/SVC1-config/files/message
      - equal:
          path: spec.application.volumeMounts
          value:
            SVC1-config:
              source: configMap
              files:
                message: hello

  - it: a leader whose ID sorts before its greeter still validates
    template: call.yaml
    set:
      target: prod-01
      application:
        services:
          A_LEADER:
            type: leader
            greeter: B_GREETER
          B_GREETER:
            type: greeter
            greeting: hi
    asserts:
      - equal:
          path: spec.application.services.A_LEADER.references
          value:
            - /spec/application/services/B_GREETER/environment/B_GREETER_GREETER
            - /spec/application/volumeMounts/B_GREETER-config/files/message

  - it: a leader whose greeter is a per-target value references the greeter of the render target
    template: call.yaml
    set:
      target: prod-01
      application:
        services:
          LEAD:
            type: leader
            greeter: {default: DEV_G, prod: PROD_G}
          DEV_G: {type: greeter, greeting: dev}
          PROD_G: {type: greeter, greeting: prod}
    asserts:
      - equal:
          path: spec.application.services.LEAD.references
          value:
            - /spec/application/services/PROD_G/environment/PROD_G_GREETER
            - /spec/application/volumeMounts/PROD_G-config/files/message

  - it: a leader whose greeter is a marker resolves it
    template: call.yaml
    set:
      target: prod-01
      application:
        services:
          PICK:
            type: environment
            environment:
              PICK_GREETER: B_GREETER
          LEAD:
            type: leader
            greeter: "@PICK_GREETER@"
          B_GREETER: {type: greeter, greeting: hi}
    asserts:
      - equal:
          path: spec.application.services.LEAD.references
          value:
            - /spec/application/services/B_GREETER/environment/B_GREETER_GREETER
            - /spec/application/volumeMounts/B_GREETER-config/files/message

  - it: a leader without greeter generates nothing and has no references
    template: call.yaml
    set:
      target: prod-01
      application:
        services:
          LONE:
            type: leader
    asserts:
      - equal:
          path: spec.application.services.LONE
          value:
            type: leader
      - notExists:
          path: spec.application.volumeMounts

  - it: a reference to a greeter that does not exist is dropped and the references key is absent
    template: call.yaml
    values:
      - ../harness/ci/test-values/references-dangling.yaml
    asserts:
      - equal:
          path: spec.application.services.SVC2
          value:
            type: leader
            environment:
              SVC2_SEED:
                value: "5"
                targetContainer: main

  - it: a reference to a variable that is not exported is dropped while the file reference is kept
    template: call.yaml
    values:
      - ../harness/ci/test-values/references-not-exported.yaml
    asserts:
      - equal:
          path: spec.application.services.SVC2.references
          value:
            - /spec/application/volumeMounts/SVC1-config/files/message
      - notExists:
          path: spec.application.services.SVC1.environment

  - it: a leader of a disabled greeter drops both references and has no references key
    template: call.yaml
    values:
      - ../harness/ci/test-values/references-disabled.yaml
    asserts:
      - equal:
          path: spec.application.services
          value:
            SVC2:
              type: leader
              environment:
                SVC2_SEED:
                  value: "5"
                  targetContainer: main
      - notExists:
          path: spec.application.services.SVC2.references
      - notExists:
          path: spec.application.volumeMounts

  - it: two leaders of one greeter each list the same targets
    template: call.yaml
    set:
      target: prod-01
      application:
        services:
          G:
            type: greeter
            greeting: hi
          L1:
            type: leader
            greeter: G
          L2:
            type: leader
            greeter: G
    asserts:
      - equal:
          path: spec.application.services.L1.references
          value:
            - /spec/application/services/G/environment/G_GREETER
            - /spec/application/volumeMounts/G-config/files/message
      - equal:
          path: spec.application.services.L2.references
          value:
            - /spec/application/services/G/environment/G_GREETER
            - /spec/application/volumeMounts/G-config/files/message

  - it: a service referencing nothing has no references key
    template: call.yaml
    values:
      - ../harness/ci/test-values/references-basic.yaml
    asserts:
      - notExists:
          path: spec.application.services.SVC1.references

  # ---- probe: self-references ----

  - it: probe - self-references of every kind record a WARNING each and are dropped
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-self.yaml
    asserts:
      - equal:
          path: diag.warnings
          value:
            - "service 'A' references '/spec/application/services/A', which it defines itself — dropped"
            - "service 'A' references '/spec/application/services/A/environment/A_VAR', which it defines itself — dropped"
            - "service 'A' references '/spec/application/volumeMounts/a-mount', which it defines itself — dropped"
            - "service 'A' references '/spec/application/volumeMounts/a-mount/files/a.txt', which it defines itself — dropped"
            - "service 'B' references '/spec/application/volumeMounts/shared/files/b.txt', which it defines itself — dropped"
      - notExists:
          path: model.spec.application.services.A.references
      - equal:
          path: diag.errors
          value: []

  - it: probe - a mount shared with another contributor and another service's file are kept
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-self.yaml
    asserts:
      - equal:
          path: model.spec.application.services.B.references
          value:
            - /spec/application/volumeMounts/shared
            - /spec/application/volumeMounts/shared/files/c.txt

  # ---- probe: whole nodes, cycles, duplicates, late targets ----

  - it: probe - whole service and whole mount references validate, duplicates collapse, the list is sorted
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-whole-nodes.yaml
    asserts:
      - equal:
          path: model.spec.application.services.A.references
          value:
            - /spec/application/services/B
            - /spec/application/services/LATE/environment/LATE_VAR
            - /spec/application/volumeMounts/b-mount

  - it: probe - services referencing each other (a cycle) record no diagnostics for the cycle
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-whole-nodes.yaml
    asserts:
      - equal:
          path: model.spec.application.services.B.references
          value:
            - /spec/application/services/A

  - it: probe - references to a missing service and a missing mount record an ERROR each, in pointer order
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-whole-nodes.yaml
    asserts:
      - equal:
          path: diag.errors
          value:
            - "service 'A' references '/spec/application/services/GHOST', which does not exist — dropped"
            - "service 'A' references '/spec/application/volumeMounts/ghost-mount', which does not exist — dropped"
      - equal:
          path: diag.warnings
          value: []

  - it: probe - the registry holds the descriptor of every distinct reference
    template: helpers_probe.yaml
    values:
      - ../harness/ci/probe-values/references-whole-nodes.yaml
    asserts:
      - equal:
          path: registry.references.B
          value:
            /spec/application/services/A:
              segments: [spec, application, services, A]

  - it: probe - a reference helper for a service that was not added records an ERROR and nothing else
    template: helpers_probe.yaml
    set:
      application:
        services:
          A:
            type: environment
      helpersProbe:
        references: true
        calls:
          - {helper: referenceService, params: {id: A, service: A}}
          - {helper: referenceVar, params: {id: A, service: A, name: X}}
          - {helper: referenceMount, params: {id: A, mount: m}}
          - {helper: referenceFile, params: {id: A, mount: m, file: f}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "service 'A' was not added — helper 'mycrd.service.referenceService' ignored"
            - "service 'A' was not added — helper 'mycrd.service.referenceVar' ignored"
            - "service 'A' was not added — helper 'mycrd.service.referenceMount' ignored"
            - "service 'A' was not added — helper 'mycrd.service.referenceFile' ignored"
      - equal:
          path: registry.references
          value: {}
      - equal:
          path: model
          value: {}

  - it: probe - the references integration without any reference changes nothing
    template: helpers_probe.yaml
    set:
      application:
        services:
          A:
            type: environment
      helpersProbe:
        references: true
        calls:
          - {helper: add, params: {id: A}}
    asserts:
      - equal:
          path: model
          value:
            spec:
              application:
                services:
                  A:
                    type: environment
      - equal:
          path: diag
          value:
            errors: []
            warnings: []
