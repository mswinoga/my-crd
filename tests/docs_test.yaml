# The values reference (VALUES.md) through
# harness/templates/documentation.md.yaml (renders only when .Values.documentation
# is set). `make docs` writes the same Markdown to VALUES.md.
suite: my-crd values reference
templates:
  - documentation.md.yaml
tests:
  - it: renders nothing when documentation is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: every schema node has a doc (except a switch case's switch key)
    set:
      documentation: true
    asserts:
      - equal:
          path: undocumented
          value: []

  - it: the Markdown reference matches the snapshot
    set:
      documentation: true
    asserts:
      - matchSnapshot:
          path: markdown
